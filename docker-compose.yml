version: '3.9'
services:
  memory:
    image: doobidoo/mcp-memory-service:latest
    ports:
      - '8765:8765'
    volumes:
      - memory_data:/app/sqlite_db
    environment:
      - MCP_MODE=streamable-http
      - MCP_SSE_HOST=0.0.0.0
      - MCP_SSE_PORT=8765
      - MCP_ALLOW_ANONYMOUS_ACCESS=true
      - MCP_MEMORY_STORAGE_BACKEND=sqlite_vec
      - MCP_MEMORY_SQLITE_PATH=/app/sqlite_db/memory.db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - '8080:8080'
    depends_on:
      - memory
    env_file:
      - ./backend/.env
    environment:
      - MCP_MEMORY_URL=http://memory:8765/mcp
    volumes:
      - backend_data:/app/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - '4200:4200'
    restart: unless-stopped
    # Browser calls the host-mapped backend; URL is baked into the Angular build
    # (src/environments). No runtime BACKEND_URL injection.

volumes:
  memory_data:
  backend_data:
