<div class="chat-input">
  <label class="chat-input__label" for="agent-command">
    Befehl an den Agenten
  </label>

  <textarea
    id="agent-command"
    placeholder="Beschreibe, was dein Agent als Naechstes erledigen soll ..."
    [value]="inputText()"
    (input)="inputText.set($any($event.target).value)"
    (keydown.enter)="$event.preventDefault(); sendMessage()"
  ></textarea>

  <div class="chat-input__footer">
    <button
      type="button"
      (click)="simulateAgentMessage()"
      class="btn-secondary"
    >
      Agent Test
    </button>
    <button type="button" (click)="sendMessage()">Senden</button>
  </div>
</div>
