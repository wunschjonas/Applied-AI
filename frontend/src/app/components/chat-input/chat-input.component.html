<div class="chat-input">
  <label class="chat-input__label" for="agent-command">
    Befehl an den Agenten
  </label>

  <textarea
    id="agent-command"
    placeholder="Beschreibe, was dein Agent als Nächstes erledigen soll ..."
    [value]="inputText()"
    (input)="inputText.set($any($event.target).value)"
    (keydown.enter)="$event.preventDefault(); sendMessage()"
  ></textarea>

  <div class="chat-input__footer">
    <button type="button" [disabled]="!canSend()" (click)="sendMessage()">
      Senden
    </button>
  </div>
</div>
