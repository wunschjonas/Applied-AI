<div class="page-shell">
  <app-sidebar />

  <section class="page-content">
    <div class="agent-stage">
      <h1>Home</h1>

      <div class="post-select-section">
        <label class="post-select-label" for="postSelect">
          Post auswählen
          <button
            class="refresh-btn"
            (click)="loadPosts()"
            [disabled]="isLoadingPosts()"
            title="Aktualisieren"
          >
            &#x21bb;
          </button>
        </label>
        <select
          id="postSelect"
          class="post-select"
          [disabled]="isLoadingPosts() || allPosts().length === 0"
          (change)="
            selectPost(allPosts()[$any($event.target).selectedIndex - 1])
          "
        >
          <option value="" disabled [selected]="!postFacade.currentPostId()">
            {{
              isLoadingPosts()
                ? "Lädt..."
                : allPosts().length === 0
                  ? "Keine Posts vorhanden"
                  : "Post wählen..."
            }}
          </option>
          @for (post of allPosts(); track post.id) {
            <option
              [value]="post.id"
              [selected]="postFacade.currentPostId() === post.id"
            >
              {{ post.title }}
            </option>
          }
        </select>
      </div>

      <div class="post-init">
        <input
          type="text"
          class="post-title-input"
          placeholder="Post-Titel eingeben..."
          [(ngModel)]="postTitle"
          (keydown.enter)="createPost()"
        />
        <button
          class="create-btn"
          [disabled]="isCreating() || !postTitle().trim()"
          (click)="createPost()"
        >
          {{ isCreating() ? "Erstelle..." : "Create" }}
        </button>
      </div>

      @if (postFacade.currentPost()) {
        <div class="post-info">
          <span
            ><strong>Post ID:</strong>
            {{ postFacade.currentPost()!.post_id }}</span
          >
          <span
            ><strong>Titel:</strong> {{ postFacade.currentPost()!.title }}</span
          >
          @if (postFacade.currentPost()!.created_at) {
            <span
              ><strong>Erstellt am:</strong>
              {{
                postFacade.currentPost()!.created_at | date: "dd.MM.yyyy HH:mm"
              }}</span
            >
          }
        </div>
      }

      <app-chat-panel
        [messages]="chatFacade.mainAgentChat()"
        (userSend)="onUserSend($event)"
        (agentSend)="onAgentSend($event)"
      />
    </div>
  </section>
</div>
