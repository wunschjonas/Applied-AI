<div class="page-shell">
  <app-sidebar />

  <section class="page-content">
    <div class="agent-stage">
      <h1>Home</h1>

      <div class="post-init">
        <input
          type="text"
          class="post-title-input"
          placeholder="Post-Titel eingeben..."
          [(ngModel)]="postTitle"
          (keydown.enter)="createPost()"
        />
        <button
          class="create-btn"
          [disabled]="isCreating() || !postTitle().trim()"
          (click)="createPost()"
        >
          {{ isCreating() ? "Erstelle..." : "Create" }}
        </button>
      </div>

      @if (postFacade.currentPost()) {
        <div class="post-info">
          <span
            ><strong>Post ID:</strong>
            {{ postFacade.currentPost()!.post_id }}</span
          >
          <span
            ><strong>Titel:</strong> {{ postFacade.currentPost()!.title }}</span
          >
          <span
            ><strong>Erstellt am:</strong>
            {{
              postFacade.currentPost()!.created_at | date: "dd.MM.yyyy HH:mm"
            }}</span
          >
        </div>
      }

      <app-chat-panel
        [messages]="chatFacade.mainAgentChat()"
        (userSend)="onUserSend($event)"
        (agentSend)="onAgentSend($event)"
      />
    </div>
  </section>
</div>
