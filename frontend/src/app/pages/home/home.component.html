<div class="page-shell">
  <app-sidebar />

  <section class="page-content">
    <div class="home-stage">
      <div class="home-copy">
        <span class="eyebrow">Agent Workspace</span>
        <h1>Home</h1>
        <p>
          Gib deinem Agenten hier direkt einen Befehl. Die Eingabe ist als
          zentrale Prompt-Leiste vorbereitet.
        </p>
      </div>

      <app-chat-panel
        [messages]="chatFacade.mainAgentChat()"
        (userSend)="onUserSend($event)"
        (agentSend)="onAgentSend($event)"
      />
    </div>
  </section>
</div>
