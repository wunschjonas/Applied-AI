<div class="page-shell">
  <app-sidebar />

  <section class="page-content">
    <div class="page-header">
      <h1>Logs</h1>
      <span class="log-count">{{ logs.length }} Einträge</span>
    </div>

    <div class="filter-bar">
      <button class="filter-btn" [class.active]="activeFilter === 'all'" (click)="loadAll()">
        Alle Logs
      </button>
      <button class="filter-btn" [class.active]="activeFilter === 'manager'" (click)="loadManagerLogs()">
        Manager Agent
      </button>
      <button class="filter-btn" [class.active]="activeFilter === 'text'" (click)="loadTextLogs()">
        Text Agent
      </button>
      <button class="filter-btn" [class.active]="activeFilter === 'image'" (click)="loadImageLogs()">
        Bild Agent
      </button>
    </div>

    <div class="loading" *ngIf="isLoading">Lade Logs...</div>

    <div class="empty" *ngIf="!isLoading && logs.length === 0">
      Keine Logs vorhanden.
    </div>

    <ul class="log-list" *ngIf="!isLoading && logs.length > 0">
      <li class="log-item" *ngFor="let log of logs">
        <div class="log-header">
          <span class="log-action">{{ log.action }}</span>
          <span class="log-status" [class.success]="log.status === 'success'" [class.error]="log.status === 'error'">
            {{ log.status }}
          </span>
        </div>
        <div class="log-body">
          <span class="log-summary">{{ log.input_summary }}</span>
        </div>
        <div class="log-footer">
          <span class="log-agent">{{ log.agent }}</span>
          <span class="log-meta">{{ log.timestamp | date: 'dd.MM.yyyy, HH:mm:ss' }}</span>
          <span class="log-duration">{{ log.duration_ms }} ms</span>
        </div>
      </li>
    </ul>
  </section>
</div>
